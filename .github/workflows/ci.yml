name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth: 0（完整歷史）：tests/test_scoreless_streak_no_logic_diff.py
          # 要 diff 對 baseline commit b974b10；預設 fetch-depth: 1（淺層 clone）
          # 會讓該 commit 在此 checkout 無法解析，測試因而 skip 而非真正驗證。
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Ruff lint
        run: uv run ruff check
      - name: Pytest
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Contract tests
        run: npm test
