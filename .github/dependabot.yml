# 依賴更新提醒（每月一次、同生態系合併成一個 PR，避免每天一堆小 PR）。
# 本 repo 每個 PR 都要走 vNext 卡片流程：Dependabot 開的 PR 只是「提醒＋已算好的 lock diff」，
# 合併前仍由 PM 開卡、依 CI 與審核程序處理；⛔ 不設 auto-merge。
# 主版本升級（Next 16、recharts 3、TypeScript 7）刻意排除：那是獨立卡的量，不是例行更新。
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
        # 保留 major ignore。理由：16.4.x 升級由 #419 執行（PR #424），下一 major（17）仍需獨立卡評估；回看 2027-05
      - dependency-name: recharts
        update-types: [version-update:semver-major]
        # 保留 major ignore。理由：3.x 評估完成、判升（#419）；升級 PR 依裁定等 #415 結案或裁定不改載入方式後，
        # 由相連子卡 #423 執行；回看 2027-03
      - dependency-name: typescript
        update-types: [version-update:semver-major]
        # 保留 major ignore。理由：7.x 暫不升——7.0 無 JS API，Next 15／typescript-eslint／test loader 三條鏈不相容
        # （#419 評估）；6.x 亦被本條擋住，是否先升 6 另案；回看 2027-02
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
