# 本地開發用：自帶一個 PostgreSQL（port 5433，避免與主站 5432 衝突）。
# 生產時不用這個檔，而是把 service 併入主站 docker-compose.prod.yml，
# DATABASE_URL 指向主站 postgres（schema 仍為 cpbl）。
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:17-alpine
    # ⚠️ **刻意不設 TZ**：生產的 `prod_pg` 是主站 PersonalWebsite 與 cpbl 共用的單一
    # `alpha_db`，server-wide timezone 不歸本專案管、也不能改。本機跟著留 UTC 才是
    # 忠實鏡像；台北日界由 `cpbl.db` 的 pool `configure` 逐連線 `SET TIME ZONE` 提供。
    environment:
      POSTGRES_USER: cpbl
      POSTGRES_PASSWORD: cpbl
      POSTGRES_DB: cpbl
    ports:
      - "5433:5432"
    volumes:
      - cpbl_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpbl"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cpbl:cpbl@db:5432/cpbl
      REDIS_URL: redis://redis:6379/0
      PORT: "4001"
      # 與 Dockerfile 的 `ENV TZ` 同值。明寫一次是為了讓「開發＝生產」在 compose 這一層
      # 也看得見；生產站沿用映像內的 ENV（主站 compose 跨 repo，不在本卡射程）。
      TZ: Asia/Taipei
    ports:
      - "4001:4001"
    volumes:
      - cpbl_artifacts:/app/artifacts

  live-worker:
    build: .
    command: ["cpbl-live-worker"]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      LIVE_GAME_WORKER_ENABLED: "true"
      TZ: Asia/Taipei

  web:
    build: ./web
    depends_on:
      - api
    environment:
      API_URL: http://api:4001                  # Server Component（容器內網）
      NEXT_PUBLIC_API_URL: http://localhost:4001 # 瀏覽器（host 發布埠）
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  cpbl_pgdata:
  cpbl_artifacts:
